<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PHARM-CKD Clinic · ระบบบันทึก BPML</title>
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#0d3d30" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="PHARM-CKD" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --sans: "IBM Plex Sans Thai", system-ui, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, monospace;
    --cell-pad: 0.72rem;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { font-family: var(--sans); background: var(--bg, #f1f6f5); -webkit-font-smoothing: antialiased; }
  #root { min-height: 100vh; }
  button { font-family: var(--sans); }
  input, select, textarea { font-family: var(--sans); }
  input:focus, select:focus, textarea:focus { border-color: var(--brand) !important; box-shadow: 0 0 0 3px color-mix(in srgb, var(--brand) 16%, transparent); }
  ::placeholder { color: #9aa8a6; }
  .prow:hover, .hrow:hover, .acrow:hover { background: var(--surface-2) !important; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: #c8d4d2; border-radius: 99px; border: 2px solid transparent; background-clip: content-box; }

  /* ── Keyframes ── */
  @keyframes fadeUp    { from{opacity:0;transform:translateY(14px)} to{opacity:1;transform:translateY(0)} }
  @keyframes fadeIn    { from{opacity:0} to{opacity:1} }
  @keyframes slideRight{ from{opacity:0;transform:translateX(-12px)} to{opacity:1;transform:translateX(0)} }
  @keyframes scaleIn   { from{opacity:0;transform:scale(0.92)} to{opacity:1;transform:scale(1)} }
  @keyframes pulse-danger {
    0%,100% { box-shadow: 0 0 0 0 rgba(220,38,38,.45); }
    60%     { box-shadow: 0 0 0 7px rgba(220,38,38,0); }
  }
  @keyframes pulse-brand {
    0%,100% { box-shadow: 0 0 0 0 rgba(13,148,136,.4); }
    60%     { box-shadow: 0 0 0 6px rgba(13,148,136,0); }
  }
  @keyframes shimmer {
    0%   { background-position: -600px 0; }
    100% { background-position:  600px 0; }
  }
  @keyframes spin      { to { transform:rotate(360deg); } }
  @keyframes gradient-pan {
    0%   { background-position: 0% 50%; }
    50%  { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }
  @keyframes float {
    0%,100% { transform: translateY(0px) rotate(0deg); }
    33%     { transform: translateY(-8px) rotate(1deg); }
    66%     { transform: translateY(-4px) rotate(-1deg); }
  }
  @keyframes bar-fill  { from{width:0} }
  @keyframes ring-fill { from{stroke-dasharray:0 999} }
  @keyframes draw-path { from{stroke-dashoffset:1} to{stroke-dashoffset:0} }
  @keyframes ripple    { to{transform:scale(4);opacity:0} }
  @keyframes number-pop{ 0%{transform:scale(1.18)} 60%{transform:scale(0.96)} 100%{transform:scale(1)} }
  @keyframes toastIn   { from{opacity:0;transform:translateY(16px) scale(0.94)} to{opacity:1;transform:translateY(0) scale(1)} }
  @keyframes shake     { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-6px)} 40%{transform:translateX(6px)} 60%{transform:translateX(-4px)} 80%{transform:translateX(4px)} }
  @keyframes slideInCard { from{opacity:0;transform:translateY(22px)} to{opacity:1;transform:translateY(0)} }

  /* ── Card Modern ── */
  .card-modern {
    box-shadow: 0 1px 3px rgba(0,0,0,.04), 0 4px 20px rgba(0,0,0,.07);
    border: 1px solid rgba(255,255,255,.7) !important;
    transition: box-shadow 0.25s ease, transform 0.22s ease;
    background-clip: padding-box;
  }
  .card-modern:hover {
    box-shadow: 0 6px 16px rgba(0,0,0,.09), 0 16px 40px rgba(0,0,0,.11);
    transform: translateY(-2px);
  }

  /* ── Gradient KPI glass cards ── */
  .kpi-grad {
    position: relative; overflow: hidden;
    transition: box-shadow 0.25s ease, transform 0.22s ease !important;
  }
  .kpi-grad:hover {
    transform: translateY(-3px) scale(1.015) !important;
    box-shadow: 0 10px 30px rgba(0,0,0,.22), 0 0 0 1px rgba(255,255,255,.18) !important;
  }
  .kpi-grad::after {
    content: "";
    position: absolute; inset: 0;
    background: linear-gradient(135deg, rgba(255,255,255,.12) 0%, rgba(255,255,255,0) 60%);
    pointer-events: none;
    border-radius: inherit;
  }

  /* ── Stagger entrance ── */
  .stagger { animation: fadeUp 0.38s ease-out both; }
  .stagger-1 { animation-delay: 0.04s; }
  .stagger-2 { animation-delay: 0.09s; }
  .stagger-3 { animation-delay: 0.14s; }
  .stagger-4 { animation-delay: 0.20s; }
  .stagger-5 { animation-delay: 0.26s; }
  .stagger-6 { animation-delay: 0.32s; }

  /* ── Skeleton shimmer ── */
  .skeleton {
    background: linear-gradient(90deg, var(--surface-2) 25%, rgba(255,255,255,.55) 50%, var(--surface-2) 75%);
    background-size: 600px 100%;
    animation: shimmer 1.6s ease-in-out infinite;
    border-radius: 8px;
  }

  /* ── Animated progress bar ── */
  .anim-bar { animation: bar-fill 0.7s cubic-bezier(0.34,1.4,0.64,1) both; }

  /* ── Animated ring ── */
  .anim-ring { animation: ring-fill 0.8s cubic-bezier(0.34,1.1,0.64,1) both; }

  /* ── Animated SVG path draw ── */
  .anim-path {
    stroke-dasharray: 1;
    stroke-dashoffset: 0;
    pathLength: 1;
    animation: draw-path 0.9s ease-out both;
  }

  /* ── Page enter ── */
  .page-enter { animation: fadeUp 0.28s cubic-bezier(0.22,1,0.36,1) both; }

  /* ── Row hover ── */
  .prow, .hrow, .acrow { transition: background 0.13s ease !important; }

  /* ── Risk badges ── */
  .risk-high-pulse  { animation: pulse-danger 2.2s ease-in-out infinite; }
  .risk-brand-pulse { animation: pulse-brand  2.5s ease-in-out infinite; }

  /* ── Button ripple ── */
  .btn-primary {
    position: relative; overflow: hidden;
    transition: filter 0.18s, transform 0.16s, box-shadow 0.18s;
  }
  .btn-primary:hover  { filter: brightness(1.08); transform: translateY(-1px); box-shadow: 0 6px 20px rgba(13,148,136,.38); }
  .btn-primary:active { transform: scale(0.97); }
  .btn-primary .ripple-el {
    position: absolute; border-radius: 50%;
    background: rgba(255,255,255,.35);
    transform: scale(0); animation: ripple 0.55s linear;
    pointer-events: none;
  }

  /* ── Number counter pop ── */
  .num-pop { animation: number-pop 0.4s cubic-bezier(0.34,1.56,0.64,1) both; }

  /* ── Page slide transitions ── */
  @keyframes slideInRight { from { opacity:0; transform:translateX(18px); } to { opacity:1; transform:translateX(0); } }
  @keyframes slideInLeft  { from { opacity:0; transform:translateX(-18px); } to { opacity:1; transform:translateX(0); } }
  .page-enter { animation: slideInRight 0.26s cubic-bezier(0.22,1,0.36,1) both; }

  /* ── Card hover lift ── */
  .card-lift { transition: box-shadow 0.22s ease, transform 0.2s ease; cursor:pointer; }
  .card-lift:hover { transform: translateY(-3px); box-shadow: 0 10px 28px rgba(0,0,0,.14) !important; }
  .card-lift:active { transform: translateY(-1px) scale(0.985); }

  /* ── Input focus glow ── */
  input:focus, select:focus, textarea:focus {
    border-color: var(--brand) !important;
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--brand) 16%, transparent);
    outline: none;
  }

  /* ── Success flash ── */
  @keyframes successFlash { 0%,100% { background: inherit; } 40% { background: #f0fdf4; } }
  .success-flash { animation: successFlash 0.7s ease-out; }

  /* ── Skeleton shimmer ── */
  .skeleton-line { height: 14px; border-radius: 7px; background: linear-gradient(90deg, var(--surface-2) 25%, rgba(255,255,255,.5) 50%, var(--surface-2) 75%); background-size: 400px 100%; animation: shimmer 1.4s ease-in-out infinite; }

  /* ── Toast slide ── */
  @keyframes toastSlideIn { from { opacity:0; transform:translateY(20px) scale(0.95); } to { opacity:1; transform:translateY(0) scale(1); } }
  @keyframes toastSlideOut { to { opacity:0; transform:translateY(10px) scale(0.95); } }

  /* ── Floating decoration ── */
  .float-anim { animation: float 6s ease-in-out infinite; }
  .float-anim-2 { animation: float 8s ease-in-out infinite; animation-delay: -2s; }

  /* ── Sidebar nav item ── */
  .nav-item-active { position: relative; }
  .nav-item-active::before {
    content: ""; position: absolute; left: 0; top: 8px; bottom: 8px;
    width: 3px; border-radius: 0 3px 3px 0;
    background: rgba(255,255,255,.9);
  }

  /* responsive */
  @media (max-width: 980px) {
    .dash-grid { grid-template-columns: 1fr !important; }
    .detail-grid { grid-template-columns: 1fr !important; }
  }
  @media (max-width: 760px) {
    .sidebar { position: static !important; width: 100% !important; height: auto !important; flex-direction: row !important; align-items: center; flex-wrap: wrap; }
    .sidebar nav { flex-direction: row !important; flex: 1 1 100% !important; order: 3; overflow-x: auto; }
    .ptbl-head, .prow { min-width: 640px; }
    .ptbl-wrap { overflow-x: auto; }
  }
  @media (max-width: 520px) {
    .ptbl-head { display: none !important; }
    .pinfo-row { grid-template-columns: 1fr 1fr !important; }
  }

  /* ── Keyboard focus ring (เห็นชัดเมื่อใช้ Tab/keyboard, ซ่อนเมื่อคลิกเมาส์) ── */
  :focus-visible {
    outline: 2px solid var(--brand);
    outline-offset: 2px;
    border-radius: 6px;
  }
  button:focus:not(:focus-visible),
  input:focus:not(:focus-visible),
  select:focus:not(:focus-visible),
  a:focus:not(:focus-visible) { outline: none; }

  /* ═══════════════════════════════════════════════════════════
     ✦ POLISH LAYER — micro-interactions ทั่วทั้งระบบ
     ═══════════════════════════════════════════════════════════ */

  /* New keyframes */
  @keyframes popIn      { 0%{opacity:0;transform:scale(.85) translateY(6px)} 60%{transform:scale(1.02) translateY(0)} 100%{opacity:1;transform:scale(1)} }
  @keyframes riseIn     { from{opacity:0;transform:translateY(18px)} to{opacity:1;transform:translateY(0)} }
  @keyframes breathe    { 0%,100%{transform:scale(1)} 50%{transform:scale(1.04)} }
  @keyframes glowPulse  { 0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--brand) 40%,transparent)} 50%{box-shadow:0 0 0 6px color-mix(in srgb,var(--brand) 0%,transparent)} }
  @keyframes sheen      { 0%{transform:translateX(-120%) skewX(-18deg)} 100%{transform:translateX(220%) skewX(-18deg)} }
  @keyframes wiggle     { 0%,100%{transform:rotate(0)} 25%{transform:rotate(-7deg)} 75%{transform:rotate(7deg)} }
  @keyframes underlineGrow { from{transform:scaleX(0)} to{transform:scaleX(1)} }

  /* Stagger extension */
  .stagger-7 { animation-delay: 0.38s; }
  .stagger-8 { animation-delay: 0.44s; }
  .stagger-9 { animation-delay: 0.50s; }
  .stagger-10{ animation-delay: 0.56s; }

  /* Global button feel — กดได้นุ่มขึ้น (ไม่ทับ .btn-primary) */
  button { transition: transform 0.13s cubic-bezier(0.34,1.56,0.64,1), filter 0.16s ease, box-shadow 0.18s ease; }
  button:not(:disabled):active { transform: scale(0.96); }

  /* Light sheen sweep บนปุ่มหลัก เมื่อ hover */
  .btn-primary::before {
    content:""; position:absolute; top:0; left:0; width:42%; height:100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,.35), transparent);
    transform: translateX(-120%) skewX(-18deg); pointer-events:none; opacity:0;
  }
  .btn-primary:hover::before { opacity:1; animation: sheen 0.85s ease-out; }

  /* card-modern: ลื่นขึ้น + ขอบเรืองเล็กน้อยตอน hover */
  .card-modern { will-change: transform, box-shadow; }
  .card-modern:hover { border-color: color-mix(in srgb, var(--brand) 28%, transparent) !important; }

  /* แถวในตาราง/รายการ: เลื่อนเล็กน้อย + แถบสีซ้าย */
  .hrow, .prow, .acrow {
    position: relative;
    transition: background 0.15s ease, transform 0.15s ease, box-shadow 0.15s ease !important;
  }
  .hrow:hover, .prow:hover, .acrow:hover {
    background: var(--surface-2) !important;
    transform: translateX(3px);
  }
  .hrow::before, .prow::before, .acrow::before {
    content:""; position:absolute; left:0; top:0; bottom:0; width:0;
    background: var(--brand); border-radius: 0 3px 3px 0;
    transition: width 0.18s cubic-bezier(0.34,1.4,0.64,1);
  }
  .hrow:hover::before, .prow:hover::before, .acrow:hover::before { width:3px; }

  /* ไอคอนในปุ่มหลัก: เด้งเบา ๆ ตอน hover */
  .btn-primary:hover svg { animation: breathe 0.6s ease-in-out; }

  /* Chip / pill pop เมื่อปรากฏ */
  .chip-pop { animation: popIn 0.34s cubic-bezier(0.34,1.56,0.64,1) both; }

  /* Section header accent underline */
  .head-underline { position: relative; }
  .head-underline::after {
    content:""; position:absolute; left:0; bottom:-4px; height:3px; width:100%;
    background: linear-gradient(90deg, var(--brand), transparent);
    border-radius:3px; transform-origin:left; animation: underlineGrow 0.6s cubic-bezier(0.22,1,0.36,1) 0.15s both;
  }

  /* Modal overlay + card entrance (reusable) */
  .modal-overlay { animation: fadeIn 0.2s ease both; backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); }
  .modal-card    { animation: popIn 0.32s cubic-bezier(0.34,1.45,0.64,1) both; }

  /* Badge / notification เด้งเรียกความสนใจ */
  .attn-wiggle { animation: wiggle 0.5s ease-in-out; }
  .attn-glow   { animation: glowPulse 1.8s ease-in-out infinite; }

  /* List entrance helper (ใช้ inline delay) */
  .rise-in { animation: riseIn 0.4s cubic-bezier(0.22,1,0.36,1) both; }

  /* SVG line "วาดตัวเอง" — ใช้กับ sparkline ผลแล็บ (polyline ต้องมี pathLength="1") */
  .spark-draw { stroke-dasharray: 1; animation: draw-path 0.9s cubic-bezier(0.22,1,0.36,1) both; }
  .spark-dot  { animation: fadeIn 0.3s ease-out both; animation-delay: 0.55s; }

  /* Bottom-nav active pill — เด้งเบา ๆ ตอนเลือก (ไม่เปลี่ยน opacity) */
  .nav-pill-pop { animation: number-pop 0.36s cubic-bezier(0.34,1.56,0.64,1); }

  /* Avatar / icon button hover lift */
  .icon-hover { transition: transform 0.16s ease; }
  .icon-hover:hover { transform: translateY(-2px) scale(1.08); }

  /* ── เคารพ prefers-reduced-motion: ปิด animation ให้ผู้ใช้ที่ตั้งค่าลดการเคลื่อนไหว ── */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.001ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.001ms !important;
      scroll-behavior: auto !important;
    }
  }
</style>
</head>

    <div style="font-family:'IBM Plex Sans Thai',sans-serif;color:#5b756f;font-size:14px;font-weight:500;">กำลังโหลด PHARM-CKD Clinic…</div>
  </div>

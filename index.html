<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PHARM-CKD Clinic · ระบบบันทึก BPML</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --sans: "IBM Plex Sans Thai", system-ui, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, monospace;
    --cell-pad: 0.72rem;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { font-family: var(--sans); background: var(--bg, #f1f6f5); -webkit-font-smoothing: antialiased; }
  #root { min-height: 100vh; }
  button { font-family: var(--sans); }
  input, select, textarea { font-family: var(--sans); }
  input:focus, select:focus, textarea:focus { border-color: var(--brand) !important; box-shadow: 0 0 0 3px color-mix(in srgb, var(--brand) 16%, transparent); }
  ::placeholder { color: #9aa8a6; }
  .prow:hover, .hrow:hover, .acrow:hover { background: var(--surface-2) !important; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: #c8d4d2; border-radius: 99px; border: 2px solid transparent; background-clip: content-box; }

  /* responsive */
  @media (max-width: 980px) {
    .dash-grid { grid-template-columns: 1fr !important; }
    .detail-grid { grid-template-columns: 1fr !important; }
  }
  @media (max-width: 760px) {
    .sidebar { position: static !important; width: 100% !important; height: auto !important; flex-direction: row !important; align-items: center; flex-wrap: wrap; }
    .sidebar nav { flex-direction: row !important; flex: 1 1 100% !important; order: 3; overflow-x: auto; }
    .ptbl-head, .prow { min-width: 640px; }
    .ptbl-wrap { overflow-x: auto; }
  }
  @media (max-width: 520px) {
    .ptbl-head { display: none !important; }
    .pinfo-row { grid-template-columns: 1fr 1fr !important; }
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<!-- Firebase SDK loaded dynamically in firebase.jsx with timeout fallback -->

<script type="text/babel" src="app/drug_db.jsx"></script>
<script type="text/babel" src="app/herb_db.jsx"></script>
<script type="text/babel" src="app/drp_engine.jsx"></script>
<script type="text/babel" src="app/data.jsx"></script>
<script type="text/babel" src="app/theme.jsx"></script>
<script type="text/babel" src="app/tweaks-panel.jsx"></script>
<script type="text/babel" src="app/firebase.jsx"></script>
<script type="text/babel" src="app/settings.jsx"></script>
<script type="text/babel" src="app/login.jsx"></script>
<script type="text/babel" src="app/dashboard.jsx"></script>
<script type="text/babel" src="app/patients.jsx"></script>
<script type="text/babel" src="app/form.jsx"></script>
<script type="text/babel" src="app/app.jsx"></script>
</body>
</html>
